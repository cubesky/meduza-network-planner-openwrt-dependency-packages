name: Build tinc and FRR packages

on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      package:
        description: Package to build
        type: choice
        default: all
        options: [all, tinc, frr]
      format:
        description: Native OpenWrt package format
        type: choice
        default: all
        options: [all, ipk, apk]
      architectures:
        description: 'all, a specific OpenWrt architecture, or platform aliases: linux-amd64,arm64,arm-v7'
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test package builders
        run: python3 -B -m unittest discover -s tests -v
      - name: Verify the main project's OpenWrt build contract
        run: python3 ci/sync_upstream.py
      - name: Plan musl platform builds
        id: matrix
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_FORMAT: ${{ inputs.format }}
          INPUT_ARCHITECTURES: ${{ inputs.architectures }}
        run: python3 ci/matrix.py

  build:
    needs: plan
    name: ${{ matrix.package }} / ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the same provider-build tools as the main project
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman qemu-user-static binutils
      - name: Restore verified source archives
        uses: actions/cache@v4
        with:
          path: downloads
          key: static-sources-${{ runner.os }}-${{ hashFiles('ci/sources.lock.json') }}-${{ matrix.package }}
      - name: Build static musl binaries and native OpenWrt packages
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          ARCHES: ${{ matrix.arches }}
          FORMATS: ${{ matrix.formats }}
        run: |
          set -o pipefail
          python3 -u ci/build.py --package "$PACKAGE" --target "$TARGET" \
            --arches "$ARCHES" --formats "$FORMATS" 2>&1 | tee build.log
      - name: Install, run and remove packages in real OpenWrt userspace
        if: matrix.platform == 'linux/amd64'
        env:
          PACKAGE: ${{ matrix.package }}
          FORMATS: ${{ matrix.formats }}
        run: |
          set -o pipefail
          python3 -u ci/acceptance.py --package "$PACKAGE" --formats "$FORMATS" 2>&1 | tee -a build.log
      - name: Upload native package files and matching artifact descriptors
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.package }}-${{ matrix.slug }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Collect checksums and installation instructions
        run: |
          cp INSTALL.md dist/INSTALL.md
          cp ci/targets.json dist/build-targets.json
          cp ci/sources.lock.json dist/sources.lock.json
          cd dist
          sha256sum -- *.ipk *.apk *.json INSTALL.md > SHA256SUMS
      - name: Publish separate native packages to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file INSTALL.md
          fi
          gh release upload "$TAG" dist/* --clobber
